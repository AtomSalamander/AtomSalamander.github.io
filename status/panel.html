<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
:root{--bg:#14162e;--card:#1c1f3d;--line:#2d3160;--text:#ece9ff;--mute:#a7a3cc;--acc:#b48cff;--gold:#f3d58a}
body{margin:0;padding:14px;font:13px/1.45 system-ui,"Segoe UI",sans-serif;background:radial-gradient(120% 60% at 50% 0%,#24285a 0%,var(--bg) 60%);color:var(--text);min-height:100vh}
header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
header img{width:26px;height:26px;filter:drop-shadow(0 0 6px #b48cff88)}
h1{flex:1;margin:0;font:700 17px/1.1 Georgia,"Times New Roman",serif;letter-spacing:.05em;color:var(--gold)}
h2{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font:700 11px system-ui;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#b48cff55,transparent)}
.gm-only{display:none}body.gm .gm-only{display:block}
.who{margin-bottom:6px;font-weight:600;color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:#7f7ba6;font-size:12px}
.hint{margin-top:6px;font-size:11px;color:#7f7ba6}
.hint a{color:#ff9b9b}
.gh{margin:10px 0 5px;font:700 10.5px system-ui;color:var(--mute);letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;max-width:100%;height:28px;border-radius:14px;border:1px solid var(--line);background:#191c38;overflow:hidden}
.chip button{height:26px;border:0;background:transparent;color:var(--text);font:600 12px system-ui;cursor:pointer}
.chip button:first-child{display:inline-flex;align-items:center;gap:6px;padding:0 8px 0 3px;max-width:240px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip button small{color:var(--gold)}
.chip .x{padding:0 6px;color:#6f6b98}
.chip .x:hover{color:var(--text)}
.chip:hover{border-color:#4a4f8f}
.chip.on{background:#2d2552;border-color:var(--acc)}
.dot{flex:none;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font:800 10px/1 system-ui;box-shadow:0 0 0 2px #0b0d1a}
.card{margin-bottom:6px;border-radius:10px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--c)}
.row{display:flex;align-items:center;gap:8px;padding:7px 9px}
.row b{flex:1}
.n{padding:0 6px;border-radius:9px;background:#2a2e5c;color:var(--gold);font-weight:700;font-size:12px}
.desc{padding:0 10px 9px 37px;white-space:pre-wrap;color:#d6d2f3;font-size:12.5px}
input[type=text],input[type=number],textarea{width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:#0e1024;color:var(--text);font:13px system-ui;outline:none}
input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px #b48cff22}
textarea{resize:vertical}
label{display:block;margin:8px 0 3px;font-size:11.5px;font-weight:600;color:var(--mute)}
.inrow{display:flex;gap:6px;align-items:flex-end}
.inrow>div{flex:1;min-width:0}.inrow>.sm{flex:0 0 70px}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw button{width:22px;height:22px;padding:0;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer;box-shadow:inset 0 0 0 2px var(--bg)}
.sw button.on{border-color:var(--text);box-shadow:inset 0 0 0 2px var(--bg),0 0 8px var(--c)}
#fColor{width:30px;height:24px;padding:0;border:0;background:transparent;cursor:pointer}
details{margin-top:12px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#171a36}
summary{cursor:pointer;font-weight:700;color:var(--acc);list-style:none}
summary::-webkit-details-marker{display:none}
#pv{display:flex;align-items:center;gap:8px;margin:8px 0 0;padding:6px 8px;border-radius:8px;background:#0e1024}
.btns{display:flex;gap:6px;margin-top:8px}
.btns button,.seg button{height:34px;padding:0 10px;border:0;border-radius:10px;font:700 12px system-ui;cursor:pointer}
.main{flex:1;background:var(--acc);color:#16122e}
.alt{background:#262a52;color:var(--text)}
button:hover{filter:brightness(1.1)}
.seg{display:flex;gap:4px}
.seg button{flex:1;height:28px;background:#1c1f3d;color:var(--mute);border:1px solid var(--line)}
.seg button.on{background:#2d2552;color:var(--gold);border-color:var(--acc)}
#json{height:70px;margin-top:6px;font:11px ui-monospace,monospace}
#toast{position:sticky;bottom:0;min-height:20px;margin-top:10px;padding:4px 0;font-size:12px;color:var(--gold);background:linear-gradient(transparent,var(--bg) 40%)}
</style></head><body>
<header><img src="./icon.svg" alt=""><h1>СТАТУС-ЭФФЕКТЫ</h1></header>

<h2>Выделено</h2>
<div id="sel"></div>

<div class="gm-only">
  <h2>Библиотека</h2>
  <input id="search" type="text" placeholder="Поиск эффекта…" autocomplete="off">
  <div id="lib"></div>
  <div class="hint">Клик — повесить/снять на выделенных токенах. ✎ — изменить или скопировать в форму.</div>

  <details id="form">
    <summary id="fTitle">＋ Свой эффект</summary>
    <div class="inrow">
      <div><label for="fName">Название</label><input id="fName" type="text" maxlength="60" placeholder="Например, Горит" autocomplete="off"></div>
      <div class="sm"><label for="fIcon">Значок</label><input id="fIcon" type="text" maxlength="4" placeholder="🔥" title="1–2 символа или эмодзи. Пусто — первая буква названия"></div>
      <div class="sm"><label for="fN">Счётчик</label><input id="fN" type="number" placeholder="—" title="Необязательно: уровень, раунды… Показывается на кругляшке"></div>
    </div>
    <label>Цвет</label>
    <div class="sw"><span id="sw" class="sw"></span><input id="fColor" type="color" title="Любой цвет"></div>
    <label for="fDesc">Описание</label>
    <textarea id="fDesc" rows="4" placeholder="Что делает эффект, сколько длится…"></textarea>
    <div id="pv"></div>
    <div class="btns"><button class="main" id="apply">Повесить на выделенные</button></div>
    <div class="btns"><button class="alt" id="save" style="flex:1">★ В библиотеку</button><button class="alt" id="reset">Очистить</button></div>
  </details>

  <h2>Настройки</h2>
  <label>Размер кругляшков (для всех в комнате)</label>
  <div class="seg" id="size"></div>
  <details>
    <summary>Резервная копия библиотеки</summary>
    <textarea id="json" placeholder="Сюда попадёт JSON или вставь свой для загрузки"></textarea>
    <div class="btns"><button class="alt" id="exp" style="flex:1">Выгрузить</button><button class="alt" id="imp" style="flex:1">Загрузить</button></div>
  </details>
</div>

<div id="toast"></div>
<script type="module" src="./panel.js"></script>
</body></html>
