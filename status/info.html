<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
:root{--bg:#14162e;--card:#1c1f3d;--line:#2d3160;--text:#ece9ff;--mute:#a7a3cc;--acc:#b48cff;--gold:#f3d58a}
html,body{margin:0;background:var(--bg)}
body{padding:10px 12px 8px;font:13px/1.45 system-ui,"Segoe UI",sans-serif;color:var(--text)}
header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
h1{flex:1;margin:0;font:700 15px/1.2 Georgia,"Times New Roman",serif;color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#close{width:26px;height:26px;padding:0;border:0;border-radius:8px;background:transparent;color:var(--mute);font-size:18px;cursor:pointer}
#close:hover{background:#262a52;color:var(--text)}
.dot{flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font:800 11px/1 system-ui;box-shadow:0 0 0 2px #0b0d1a,0 0 8px -2px var(--c,#000)}
.card{margin-bottom:6px;border-radius:10px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--c);overflow:hidden}
.card.on{box-shadow:0 0 14px -8px var(--c)}
.row{display:flex;align-items:center;gap:8px;padding:7px 9px;cursor:pointer;user-select:none}
.row b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n{min-width:20px;padding:0 6px;border-radius:9px;background:#2a2e5c;color:var(--gold);font-weight:700;font-size:12px;text-align:center}
.chev{color:var(--mute)}
.tools{display:flex;gap:2px}
.tools button{width:24px;height:24px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--mute);font:700 13px system-ui;cursor:pointer}
.tools button:hover{background:#2a2e5c;color:var(--text)}
.tools .x:hover{color:#ff8a8a}
.desc{padding:0 10px 9px 39px;white-space:pre-wrap;color:#d6d2f3;font-size:12.5px}
.empty{padding:10px 2px;color:var(--mute)}
.add{width:100%;height:32px;margin-top:2px;border:1px dashed var(--line);border-radius:10px;background:transparent;color:var(--acc);font:700 12px system-ui;cursor:pointer}
.add:hover{background:#1c1f3d}
.gh{margin:10px 0 5px;font:700 10.5px system-ui;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px 0 4px;border-radius:14px;border:1px solid var(--line);background:#191c38;color:var(--text);font:600 12px system-ui;cursor:pointer}
.chip .dot{width:20px;height:20px;font-size:10px}
.chip:hover{border-color:var(--acc)}
.chip.on{background:#2d2552;border-color:var(--acc)}
input[type=text],input[type=number],textarea{width:100%;padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:#0e1024;color:var(--text);font:13px system-ui;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
#search{margin-top:8px;height:32px}
textarea{resize:vertical;margin:6px 0}
.edit{padding:8px}
.inrow{display:flex;gap:6px}
.inrow .sm{width:62px;flex:none}
.sw{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;align-items:center}
.sw button{width:20px;height:20px;padding:0;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer;box-shadow:inset 0 0 0 2px var(--card)}
.sw button.on{border-color:var(--text)}
.sw input[type=color]{width:26px;height:22px;padding:0;border:0;background:transparent;cursor:pointer}
button.main,button.alt{flex:1;height:32px;border:0;border-radius:10px;font:700 12px system-ui;cursor:pointer}
button.main{background:var(--acc);color:#16122e}
button.alt{background:#262a52;color:var(--text)}
#toast{min-height:16px;font-size:11.5px;color:var(--gold)}
</style></head><body>
<header><h1 id="title">…</h1><button id="close" title="Закрыть">×</button></header>
<div id="list"></div>
<div id="toast"></div>
<script type="module" src="./info.js"></script>
</body></html>
