<!doctype html><html lang="ru"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{background:rgba(8,6,4,.32);cursor:crosshair;font:14px/1.4 system-ui,"Segoe UI",sans-serif;color:#F6EEDF;user-select:none;-webkit-user-select:none}
#hint{position:absolute;left:50%;top:24px;transform:translateX(-50%);display:flex;align-items:center;gap:16px;padding:10px 12px 10px 18px;border-radius:10px;
  background:#120d09F0;border:1px solid #E8C17066;box-shadow:0 8px 24px -10px #000;cursor:default;white-space:nowrap}
#hint b{color:#F3D27A;font-weight:700}
#hint span{color:#B5A48A}
#cancel{height:36px;padding:0 14px;border-radius:8px;border:1px solid #3a2c1c;background:#2a2016;color:#F6EEDF;font:700 13px system-ui;cursor:pointer}
#cancel:hover{filter:brightness(1.15)}
#cancel:focus-visible{outline:2px solid #E8C170;outline-offset:2px}
/* призрак плашки */
#ghost{position:absolute;width:284px;height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:10px;pointer-events:none;
  background:#17110cD9;border:1.5px dashed #F3D27A;box-shadow:0 0 18px -4px #E8B44F99;
  font:italic 700 19px/1 "Cormorant Garamond",Georgia,serif;color:#FFF4DC}
#ghost i{display:inline-block;width:3px;border-radius:2px;background:#F3D27A}
.eq{display:flex;align-items:flex-end;gap:2px;height:18px}
@media (max-width:560px){#hint{flex-direction:column;align-items:stretch;gap:8px;white-space:normal;width:calc(100% - 32px);padding:12px}}
</style></head><body>
<div id="hint"><div><b>Кликни, куда поставить плашку</b><br><span>Esc или правый клик — отмена</span></div><button id="cancel" type="button">Отмена</button></div>
<div id="ghost" aria-hidden="true"><span class="eq"><i style="height:60%"></i><i style="height:100%"></i><i style="height:45%"></i><i style="height:80%"></i></span>Сюда</div>
<script type="module">
import { CH, SDK, PAD, PLATE } from "./const.js";

const $ = s => document.querySelector(s);
const q = new URLSearchParams(location.search);
const GW = PLATE.small.w, GH = PLATE.small.h;
const ghost = $("#ghost");

let OBR = null;
const ready = window.parent !== window
  ? import(SDK).then(m => { OBR = m.default; return new Promise(r => OBR.isReady ? r() : OBR.onReady(r)); }).catch(() => {})
  : Promise.resolve();
const send = msg => ready.then(() => OBR && OBR.broadcast.sendMessage(CH, msg, { destination: "LOCAL" })).catch(() => {});

// верхний левый угол призрака так, чтобы он не выходил за края
function place(cx, cy) {
  const W = innerWidth, H = innerHeight;
  const x = Math.max(PAD, Math.min(W - GW - PAD, cx - GW / 2));
  const y = Math.max(PAD, Math.min(H - GH - PAD, cy - GH / 2));
  ghost.style.left = x + "px"; ghost.style.top = y + "px";
  return { x, y };
}
// старт — там, где плашка стояла
const r0 = +q.get("r") || 16, b0 = +q.get("b") || 92;
place(innerWidth - r0 - PAD - GW / 2, innerHeight - b0 - PAD - GH / 2);

addEventListener("pointermove", e => place(e.clientX, e.clientY));
addEventListener("click", e => {
  if (e.target.closest("#hint")) return;
  const { x, y } = place(e.clientX, e.clientY);
  // храним отступ окна плашки (с учётом PAD) от правого нижнего угла экрана
  const right = Math.max(0, Math.round(innerWidth - (x + GW + PAD)));
  const bottom = Math.max(0, Math.round(innerHeight - (y + GH + PAD)));
  send({ op: "place", right, bottom });
});
const cancel = () => send({ op: "cancelMove" });
addEventListener("contextmenu", e => { e.preventDefault(); cancel(); });
addEventListener("keydown", e => { if (e.key === "Escape") cancel(); });
$("#cancel").addEventListener("click", cancel);
window.focus();
</script>
</body></html>
