<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
:root{--gold:#E8C170;--gold2:#C8912F;--bg:#120d09;--card:#1c150f;--line:#3a2c1c;--text:#F6EEDF;--mute:#B5A48A;--ok:#86D85A;--err:#FF8A7A}
body{margin:0;padding:14px;font:13px/1.45 system-ui,"Segoe UI",sans-serif;background:radial-gradient(120% 60% at 50% 0%,#2a1d10 0%,var(--bg) 60%);color:var(--text);min-height:100vh}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header img{width:28px;height:28px;filter:drop-shadow(0 0 6px #E8B44F88)}
h1{flex:1;margin:0;font:700 17px/1.1 Georgia,"Times New Roman",serif;letter-spacing:.06em;color:var(--gold);text-shadow:0 0 10px #E8B44F55}
h2{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font:700 11px system-ui;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#E8C17055,transparent)}
label{display:block;margin:0 0 4px;font-size:12px;font-weight:600;color:var(--mute)}
.field{margin-bottom:10px}
.inrow{display:flex;gap:6px}
input[type=text]{flex:1;min-width:0;width:100%;height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:#0b0805;color:var(--text);font:14px system-ui;outline:none;transition:border-color .15s,box-shadow .15s}
input[type=text]:focus{border-color:var(--gold);box-shadow:0 0 0 3px #E8C17026}
input::placeholder{color:#6f6250}
button{height:36px;padding:0 12px;border:0;border-radius:8px;font:700 12px system-ui;cursor:pointer;transition:filter .15s,transform .05s}
button:hover{filter:brightness(1.12)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.alt{background:#2a2016;color:var(--text);border:1px solid var(--line)}
.main{background:linear-gradient(180deg,#F3D27A,#C8912F);color:#1a1006}
.seg{display:flex;gap:4px}
.seg button{flex:1;height:32px;background:#1f1811;color:var(--mute);border:1px solid var(--line);font-weight:600}
.seg button.on{background:#3a2a14;color:var(--gold);border-color:var(--gold2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:6px}
.actions button{flex:1}


#now{margin:10px 0 0;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
#now .k{font:700 11px system-ui;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
#now .t{margin-top:2px;font:italic 700 19px/1.25 Georgia,serif;color:#FFF4DC;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#now .p{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#now.empty .t{color:#7d6e58;font-style:normal;font-size:14px}

.hint{font-size:11px;color:#8d7c63;margin-top:6px}
.hint b{color:var(--mute)}
#toast{position:sticky;bottom:0;min-height:20px;margin-top:12px;padding:4px 0;font-size:12px;color:var(--gold);background:linear-gradient(transparent,var(--bg) 40%)}
.gm{display:none}
body.isgm .gm{display:block}

.play{background:linear-gradient(180deg,#F3D27A,#C8912F);color:#1a1006;padding:0 14px}
#hist{display:flex;flex-direction:column;gap:4px;max-height:210px;overflow:auto}
#hist:empty:before{content:"Здесь появятся треки, которые ты включал";font-size:12px;color:#7d6e58}
.h{display:flex;align-items:center;gap:4px;padding:0 2px 0 10px;height:32px;border-radius:8px;border:1px solid var(--line);background:#16100b;cursor:pointer;transition:border-color .15s,background .15s}
.h:hover{border-color:var(--gold2);background:#21180f}
.h.cur{border-color:var(--gold);background:#2a1d0f}
.h span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:italic 600 14px Georgia,serif;color:#F6EEDF}
.h button{flex:none;width:28px;height:28px;padding:0;background:transparent;color:#8d7c63;font-size:14px}
.h button:hover{color:var(--err)}
#nowRow{display:flex;gap:6px;margin-top:8px}
#nowRow button{flex:1}
</style></head><body>
<header><img src="./icon.svg" alt=""><h1>МУЗЫКА</h1></header>

<div id="now" class="empty"><div class="k" id="nowK">Сейчас звучит</div><div class="t" id="nowT">Ничего не играет</div><div class="p" id="nowP"></div></div>

<div class="gm">
  <div id="nowRow"><button class="alt" id="pause" disabled>⏸ Пауза</button><button class="alt" id="clear" disabled>■ Убрать у всех</button></div>

  <h2>Включить трек</h2>
  <div class="field">
    <div class="inrow"><input id="title" type="text" maxlength="160" placeholder="Название трека" autocomplete="off"><button class="play" id="play">▶ Включить</button></div>
    <div class="field" style="margin:6px 0 0"><input id="sub" type="text" maxlength="80" placeholder="Подпись (необязательно): альбом, место, сцена" autocomplete="off" style="height:30px;font-size:12px"></div>
    <div class="hint"><b>Enter</b> — включить. У всех игроков появится плашка с названием.</div>
  </div>

  <h2>Недавние</h2>
  <div id="hist"></div>

  <h2>Крупно держится</h2>
  <div class="seg" id="big"></div>
</div>

<h2>Плашка у меня</h2>
<div class="actions">
  <button class="alt" id="reshow">Показать снова</button>
  <button class="alt" id="move">Переместить</button>
  <button class="alt" id="resetPos">В угол</button>
</div>
<div class="hint">Клик по маленькой плашке ненадолго увеличивает её. × скрывает плашку до следующего трека.</div>

<div id="toast" role="status"></div>
<script type="module" src="./panel.js"></script>
</body></html>
