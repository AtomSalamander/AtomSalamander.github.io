<!doctype html><html lang="ru"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Cormorant+SC:wght@600;700&display=swap">
<style>
:root{--a:#F3D27A;--b:#C8912F;--g:#E8B44F;--dur:5000ms}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;cursor:pointer;user-select:none}

#stage{position:relative;width:calc(100% - 24px);height:calc(100% - 24px);display:flex;align-items:center;justify-content:center;opacity:0}
.go #stage{animation:life var(--dur) cubic-bezier(.2,.7,.2,1) forwards}
@keyframes life{
  0%{opacity:0;transform:scale(.86);filter:blur(6px)}
  9%{opacity:1;transform:scale(1.025);filter:blur(0)}
  15%{transform:scale(1)}
  88%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.03);filter:blur(3px)}
}

/* табличка */
#plate{position:relative;width:100%;height:100%;border-radius:14px;overflow:hidden;
  background:
    radial-gradient(120% 90% at 50% 0%, color-mix(in srgb,var(--g) 22%,transparent) 0%, transparent 60%),
    radial-gradient(90% 120% at 50% 100%, color-mix(in srgb,var(--b) 18%,transparent) 0%, transparent 65%),
    linear-gradient(180deg,#17110cF2,#0a0706F5);
  border:1px solid color-mix(in srgb,var(--a) 70%,transparent);
  box-shadow:0 0 0 4px #0a0706cc, 0 0 0 5px color-mix(in srgb,var(--b) 55%,transparent), 0 0 40px -6px var(--g), 0 18px 40px -12px #000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px 44px}

/* внутренняя тонкая рамка */
#plate:before{content:"";position:absolute;inset:8px;border-radius:9px;border:1px solid color-mix(in srgb,var(--a) 28%,transparent);pointer-events:none}
/* блик */
#plate:after{content:"";position:absolute;top:-20%;bottom:-20%;width:28%;left:-40%;transform:skewX(-18deg);
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--a) 22%,transparent),transparent);pointer-events:none}
.go #plate:after{animation:sheen 1.6s .35s ease-out 1 forwards}
@keyframes sheen{to{left:120%}}

/* угловые ромбы */
.corner{position:absolute;width:9px;height:9px;transform:rotate(45deg);background:var(--a);box-shadow:0 0 8px var(--g)}
.c1{top:4px;left:4px}.c2{top:4px;right:4px}.c3{bottom:4px;left:4px}.c4{bottom:4px;right:4px}

/* текст */
.line{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;opacity:0}
#boss{font:700 44px/1.05 "Cormorant SC","Cormorant Garamond",Georgia,serif;letter-spacing:.06em;color:#FFF8EC;
  text-shadow:0 0 18px color-mix(in srgb,var(--g) 70%,transparent),0 2px 0 #000}
#uses{display:flex;align-items:center;gap:12px;width:min(100%,520px);font:600 15px/1 "Cormorant SC",Georgia,serif;
  letter-spacing:.28em;text-transform:lowercase;color:color-mix(in srgb,var(--a) 85%,#fff)}
#uses:before,#uses:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--a))}
#uses:after{background:linear-gradient(270deg,transparent,var(--a))}
#uses span{white-space:nowrap}
@media (max-width:560px){
  #plate{padding:18px 22px}
  #uses{gap:8px;font-size:13px;letter-spacing:.12em}
  #uses:before,#uses:after{min-width:14px}
}
@media (max-width:400px){
  #uses{letter-spacing:.06em;font-size:12.5px}
  #uses span{white-space:normal;text-align:center}
}
#act{font:italic 700 40px/1.12 "Cormorant Garamond",Georgia,serif;letter-spacing:.01em;padding:0 .1em;
  background:linear-gradient(180deg,#fff 0%,var(--a) 45%,var(--b) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px color-mix(in srgb,var(--g) 60%,transparent)) drop-shadow(0 2px 0 #000)}
#cost{display:none;align-items:center;gap:7px;margin-top:4px;font:600 13px/1 "Cormorant SC",Georgia,serif;letter-spacing:.18em;color:color-mix(in srgb,var(--a) 70%,#fff)}
#cost i{display:inline-block;width:8px;height:8px;transform:rotate(45deg);background:var(--a);box-shadow:0 0 6px var(--g)}
#cost.on{display:flex}

.go #boss{animation:rise .7s .15s cubic-bezier(.2,.8,.2,1) forwards}
.go #uses{animation:fade .6s .45s ease-out forwards}
.go #act{animation:rise .8s .6s cubic-bezier(.2,.8,.2,1) forwards}
.go #cost{animation:fade .6s .9s ease-out forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px);letter-spacing:.2em}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* пульсация свечения */
.go #plate{animation:pulse 2.4s 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px #0a0706cc,0 0 0 5px color-mix(in srgb,var(--b) 75%,transparent),0 0 56px -4px var(--g),0 18px 40px -12px #000}}

@media (prefers-reduced-motion: reduce){
  .go #stage{animation:life-r var(--dur) linear forwards}
  @keyframes life-r{0%{opacity:0}6%{opacity:1}92%{opacity:1}100%{opacity:0}}
  .go #boss,.go #uses,.go #act,.go #cost{animation:fade .3s forwards}
  .go #plate,.go #plate:after{animation:none}
}
</style></head><body>
<div id="stage" title="Кликни, чтобы закрыть">
  <div id="plate">
    <i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i>
    <div id="boss" class="line"></div>
    <div id="uses" class="line"><span>использует легендарное действие</span></div>
    <div id="act" class="line"></div>
    <div id="cost" class="line"></div>
  </div>
</div>
<script type="module">
import { THEMES, POP } from "./const.js";

const q = new URLSearchParams(location.search);
const boss = q.get("boss") || "Босс";
const act = q.get("act") || "Способность";
const th = THEMES[q.get("theme")] || THEMES.gold;
const dur = Math.max(2000, +q.get("dur") || 5000);
const cost = Math.max(0, Math.min(3, +q.get("cost") || 0));

const root = document.documentElement.style;
root.setProperty("--a", th.a); root.setProperty("--b", th.b); root.setProperty("--g", th.g);
root.setProperty("--dur", dur + "ms");

const $ = s => document.querySelector(s);
$("#boss").textContent = boss;
$("#act").textContent = "«" + act + "»";
if (cost) {
  const c = $("#cost");
  c.classList.add("on");
  for (let i = 0; i < cost; i++) c.appendChild(document.createElement("i"));
  const word = cost === 1 ? "действие" : "действия";
  const s = document.createElement("span"); s.textContent = `стоит ${cost} ${word}`; c.appendChild(s);
}

// уменьшаем шрифт, если длинное имя не помещается
function fit(el, max, min) {
  let s = max; el.style.fontSize = s + "px";
  while (el.scrollWidth > el.clientWidth + 1 && s > min) { s -= 1; el.style.fontSize = s + "px"; }
}
function start() {
  const W = $("#plate").clientWidth;
  const k = Math.min(1, W / 700);
  fit($("#boss"), Math.round(44 * k), 20);
  fit($("#act"), Math.round(40 * k), 18);
  document.body.classList.add("go");
}
const fontsReady = document.fonts ? document.fonts.ready : Promise.resolve();
Promise.race([fontsReady, new Promise(r => setTimeout(r, 700))]).then(start);

// клик — закрыть надпись досрочно
let OBR = null;
if (window.parent !== window) {
  import("https://esm.sh/@owlbear-rodeo/sdk@3").then(m => { OBR = m.default; }).catch(() => {});
}
document.body.addEventListener("click", () => {
  if (OBR && OBR.isReady) OBR.popover.close(POP).catch(() => {});
  else document.body.style.display = "none";
});
</script>
</body></html>
