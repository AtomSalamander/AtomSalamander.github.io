<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3";
const KEY="com.dnd-tracker/initiative",POP="com.dnd-tracker/bar";
let data=null,isOpen=false,lastW=0,lastH=0,lastCfg="";
const get=(k,d="")=>{try{return localStorage.getItem(k)||d}catch(e){return d}};
const enabled=()=>get("dndbar_off")!=="1";
const getPos=()=>{try{const p=JSON.parse(get("dndbar_pos","null"));return p&&typeof p.x==="number"&&typeof p.y==="number"?p:null}catch(e){return null}};

async function show(){
  const w=await OBR.viewport.getWidth(),h=await OBR.viewport.getHeight();
  lastW=w;lastH=h;
  const vert=get("dndbar_dir","top")==="left",pos=getPos();
  lastCfg=vert+"|"+(pos?pos.x+","+pos.y:"");
  const pw=vert?220:Math.max(320,Math.min(1000,w-200)),ph=vert?Math.max(280,Math.min(760,h-140)):110;
  const ax=pos?Math.max(40,Math.min(w-40,pos.x)):(vert?12:w/2);
  const ay=pos?Math.max(12,Math.min(h-40,pos.y)):(vert?h/2:12);
  await OBR.popover.open({id:POP,url:"/bar.html",width:pw,height:ph,
    anchorReference:"POSITION",anchorPosition:{left:ax,top:ay},
    transformOrigin:{horizontal:vert&&!pos?"LEFT":"CENTER",vertical:vert&&!pos?"CENTER":"TOP"},
    hidePaper:true,disableClickAway:true});
  isOpen=true;
}
async function sync(force){
  const want=enabled()&&data&&data.chips&&data.chips.length>0;
  const pos=getPos(),cfg=(get("dndbar_dir","top")==="left")+"|"+(pos?pos.x+","+pos.y:"");
  if(want){
    if(!isOpen||force||cfg!==lastCfg){
      if(isOpen&&cfg!==lastCfg){try{await OBR.popover.close(POP)}catch(e){}isOpen=false}
      await show();
    }
  }else if(isOpen){await OBR.popover.close(POP);isOpen=false}
}
OBR.onReady(async()=>{
  data=(await OBR.room.getMetadata())[KEY];
  OBR.room.onMetadataChange(m=>{data=m[KEY];sync()});
  addEventListener("storage",()=>sync());
  setInterval(async()=>{if(!isOpen)return;const w=await OBR.viewport.getWidth(),h=await OBR.viewport.getHeight();if(Math.abs(w-lastW)>40||Math.abs(h-lastH)>40)show()},2000);
  sync();
  // приём данных из отдельной вкладки трекера (через ntfy.sh) — только у мастера
  if(await OBR.player.getRole()==="GM"){
    let es=null,cur="";
    const link=()=>{
      let c=get("dnd_room");
      if(c===cur&&es)return;if(es){es.close();es=null}cur=c;if(!c)return;
      es=new EventSource("https://ntfy.sh/dndinit-"+c+"/sse?since=latest");
      es.onmessage=e=>{try{const P=JSON.parse(JSON.parse(e.data).message);if(P&&P.chips)OBR.room.setMetadata({[KEY]:P})}catch(err){}};
    };
    addEventListener("storage",link);link();
  }
});
</script></body></html>
