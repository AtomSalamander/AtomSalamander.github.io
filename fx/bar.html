<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent;overflow:hidden;font:12px/1.3 system-ui,sans-serif;color:#ece9ff;user-select:none}
#card{position:absolute;inset:4px;border-radius:16px;background:linear-gradient(160deg,#22254a 0%,#16183a 55%,#121430 100%);border:1px solid #b48cff55;box-shadow:0 6px 18px #0009,inset 0 1px 0 #ffffff14;overflow:hidden}
#card::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 0% 0%,#b48cff22,transparent 60%),radial-gradient(80% 50% at 100% 0%,#f3d58a14,transparent 60%);pointer-events:none}
header{position:relative;display:flex;align-items:center;gap:6px;height:40px;padding:0 8px 0 4px;border-bottom:1px solid #ffffff12}
#grip{width:22px;height:30px;display:grid;place-items:center;cursor:grab;color:#9a9cc0;font-size:15px;border-radius:8px;touch-action:none}
#grip:hover{background:#ffffff10;color:#f3d58a}
body.drag #grip{cursor:grabbing}
h1{margin:0;font:700 13px Georgia,serif;color:#f3d58a;white-space:nowrap}
#who{flex:1;min-width:0;display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:#0d0e20aa;border:1px solid #ffffff1a;cursor:pointer;overflow:hidden}
#who:hover{border-color:#f3d58a88}
#who b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#who.none b{color:#ff9a9a;font-weight:500}
.ib{flex:none;width:26px;height:26px;border:0;border-radius:8px;background:#ffffff0d;color:#ece9ff;font-size:13px;cursor:pointer;display:grid;place-items:center;padding:0}
.ib:hover{background:#b48cff44}
.ib.on{background:#b48cff;color:#1a1030}
main{position:relative;padding:10px}
#grid{display:grid;grid-template-columns:repeat(4,64px);gap:6px}
.t{position:relative;width:64px;height:82px;border-radius:12px;background:linear-gradient(180deg,#2a2d58,#1c1f3d);border:1px solid #ffffff18;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7px;cursor:pointer;transition:transform .08s,border-color .15s,box-shadow .15s}
.t:hover{border-color:var(--c,#b48cff);box-shadow:0 0 0 1px var(--c,#b48cff),0 0 14px -2px var(--c,#b48cff)}
.t:active{transform:scale(.95)}
.t i{font-style:normal;font-size:26px;line-height:32px;filter:drop-shadow(0 2px 4px #0008)}
.t span{display:block;width:100%;padding:3px 4px 0;text-align:center;font-size:10.5px;line-height:1.15;max-height:26px;overflow:hidden;color:#d9d6ff}
.t em{position:absolute;top:4px;left:4px;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.t u{position:absolute;top:3px;right:4px;text-decoration:none;font-size:9px;color:#f3d58a;opacity:.85}
.t.off{opacity:.35;cursor:not-allowed;filter:grayscale(.7)}
.t.flash{animation:fl .5s}
@keyframes fl{0%{box-shadow:0 0 0 2px #fff,0 0 24px var(--c,#b48cff)}100%{box-shadow:none}}
.t .x{display:none;position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;border:0;background:#ff6b6b;color:#fff;font:700 11px system-ui;cursor:pointer;padding:0;line-height:18px}
body.edit .t{cursor:grab;animation:wob .35s infinite alternate}
body.edit .t .x{display:block}
body.edit .t.over{border-color:#f3d58a}
@keyframes wob{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
footer{margin-top:8px;color:#7d80a8;font-size:10.5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:6px 4px;color:#9a9cc0;text-align:center;line-height:1.45}
body.min main{display:none}
body.min header{border-bottom:0}
#dragTip{display:none;position:absolute;inset:0;background:#0d0e20d0;color:#f3d58a;font:600 12px system-ui;align-items:center;justify-content:center;text-align:center;padding:8px;z-index:5;border-radius:16px}
body.drag #dragTip{display:flex}
</style></head><body>
<div id="card">
  <header>
    <div id="grip" title="Зажми и перетащи панель">⠿</div>
    <h1>⚡</h1>
    <div id="who" title="Заклинатель. Клик — взять выделенный токен (или Alt+1)">🪄<b id="whoN">—</b></div>
    <button class="ib" id="edit" title="Редактировать: перетаскивать и удалять">✎</button>
    <button class="ib" id="min" title="Свернуть">▾</button>
    <button class="ib" id="close" title="Закрыть (открыть снова — кнопка ⚡ в панели эффектов)">✕</button>
  </header>
  <main>
    <div id="grid"></div>
    <footer id="foot">ЛКМ — попадание / провал · ПКМ — промах / спасбросок</footer>
  </main>
  <div id="dragTip">📍 Отпусти — панель переедет сюда</div>
</div>
<script type="module" src="./bar.js"></script>
</body></html>
