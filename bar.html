<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0}
html,body{background:transparent;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:#ece9ff;user-select:none}
#w{padding:4px}
#bar{position:relative;display:flex;align-items:center;height:92px;border-radius:20px;overflow:hidden;
 background:linear-gradient(180deg,rgba(30,25,56,.88),rgba(14,15,34,.88));border:1px solid rgba(255,255,255,.14);
 box-shadow:0 8px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(10px)}
#rd{flex:none;width:84px;height:100%;display:flex;flex-direction:column;justify-content:center;text-align:center;border-right:1px solid rgba(255,255,255,.1)}
#rd small{font:600 10px sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#9a9cc0}
#rd b{font-size:34px;line-height:1;color:#f3d58a;text-shadow:0 0 14px rgba(243,213,138,.5)}
#rd.bump b{animation:bump .7s}
@keyframes bump{40%{transform:scale(1.35)}}
#vp{position:relative;flex:1;min-width:0;height:100%;overflow:hidden;
 -webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
#vp::after{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top:8px solid #f3d58a;border-bottom:0;filter:drop-shadow(0 0 6px rgba(243,213,138,.8))}
#tr{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;gap:10px;padding:0 20px;transition:transform .7s cubic-bezier(.22,1,.36,1);will-change:transform}
#tr.init{transition:none}
.c{--t:#b48cff;flex:none;min-width:74px;max-width:150px;padding:7px 12px 8px;border-radius:14px;text-align:center;
 background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-top:3px solid var(--t);
 transition:transform .5s,opacity .5s,box-shadow .5s,background .5s,margin .5s}
.c.enemy{--t:#e0605a}.c.ally{--t:#3fc8a8}.c.boss{--t:#e2b865}.c.player{--t:#b48cff}
.c b{display:block;font-size:22px;line-height:1.1;color:var(--t)}
.c span{display:block;font:600 12px sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c.done{opacity:.4}
.c.on{transform:scale(1.18);margin:0 8px;opacity:1;background:linear-gradient(160deg,rgba(96,76,26,.92),rgba(34,30,48,.92));
 border-color:#f3d58a;box-shadow:0 0 0 1px #f3d58a,0 0 24px rgba(243,213,138,.45)}
.c.on span{color:#f3d58a}
#fx{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.f{font:600 12px sans-serif;padding:4px 10px;border-radius:999px;background:rgba(20,18,40,.88);border:1px solid rgba(180,140,255,.45)}
.f.low{border-color:#e0605a;color:#ffb3ae}
.f.on{border-color:#f3d58a}
</style></head><body>
<div id="w"><div id="bar"><div id="rd"><small>Раунд</small><b id="r">1</b></div><div id="vp"><div id="tr" class="init"></div></div></div><div id="fx"></div></div>
<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3";
const KEY="com.dnd-tracker/initiative",POP="com.dnd-tracker/bar";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TI={enemy:"⚔️",ally:"🛡️",boss:"👑",player:"🧙"};
let lastR=null,sig="";
function center(){
  const tr=$("tr"),on=tr.querySelector(".c.on")||tr.querySelector(".c");if(!on)return;
  tr.style.transform=`translateX(${$("vp").clientWidth/2-(on.offsetLeft+on.offsetWidth/2)}px)`;
}
function draw(P){
  if(!P||!P.chips)return;
  const s=JSON.stringify(P);if(s===sig)return;sig=s;
  $("tr").innerHTML=P.chips.map(c=>`<div class="c ${c.t}${c.on?" on":""}${c.done?" done":""}"><b>${esc(c.i)}</b><span>${TI[c.t]||""} ${esc(c.n)}${c.c>1?" ×"+c.c:""}</span></div>`).join("");
  $("r").textContent=P.r;
  if(lastR!==null&&lastR!==P.r){const rd=$("rd");rd.classList.remove("bump");void rd.offsetWidth;rd.classList.add("bump")}
  $("fx").innerHTML=(P.fx||[]).map(f=>`<div class="f${f.r<=1?" low":""}${f.on?" on":""}">✨ ${esc(f.n)} · ${esc(f.w)} ⏳ ${f.r}</div>`).join("");
  const first=lastR===null;lastR=P.r;
  if(first)$("tr").classList.add("init");
  center();
  if(first)requestAnimationFrame(()=>requestAnimationFrame(()=>$("tr").classList.remove("init")));
  fit();
}
function fit(){try{OBR.popover.setHeight(POP,$("w").offsetHeight)}catch(e){}}
addEventListener("resize",center);
OBR.onReady(async()=>{
  const m=await OBR.room.getMetadata();draw(m[KEY]);
  OBR.room.onMetadataChange(m=>draw(m[KEY]));
});
</script></body></html>
